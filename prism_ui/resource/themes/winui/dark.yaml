font:
  TextFontFamily: "Segoe UI"

  TextFontWeightNormal: "Normal"
  TextFontWeightBold: 'Bold'

  CaptionTextBlockSize: "12px"
  BodyTextBlockSize: "14px"
  BodyStrongTextBlockSize: "14px"
  SubtitleTextBlockSize: "20px"
  TitleTextBlockSize: "28px"
  TitleLargeTextBlockSize: "40px"
  DisplayTextBlockSize: "68px"

  CaptionTextBlockLineHeight: "16px"
  BodyTextBlockLineHeight: "20px"
  BodyStrongTextBlockLineHeight: "20px"
  SubtitleTextBlockLineHeight: "28px"
  TitleTextBlockLineHeight: "36px"
  TitleLargeTextBlockLineHeight: "52px"
  DisplayTextBlockLineHeight: "92px"

color:
  # Text Colors
  TextFillColorPrimaryBrush: "#FFFFFF"
  TextFillColorSecondaryBrush: "#C5FFFFFF"
  TextFillColorTertiaryBrush: "#87FFFFFF"
  TextFillColorDisabledBrush: "#5DFFFFFF"
  TextFillColorInverseBrush: "#E4000000"

  AccentTextFillColorDisabledBrush: "#5DFFFFFF"
  TextOnAccentFillColorSelectedTextBrush: "#FFFFFF"
  TextOnAccentFillColorPrimaryBrush: "#000000"
  TextOnAccentFillColorSecondaryBrush: "#80000000"
  TextOnAccentFillColorDisabledBrush: "#87FFFFFF"

  # Control Fill Colors
  ControlFillColorDefaultBrush: "#0FFFFFFF"
  ControlFillColorSecondaryBrush: "#15FFFFFF"
  ControlFillColorTertiaryBrush: "#08FFFFFF"
  ControlFillColorDisabledBrush: "#0BFFFFFF"
  ControlFillColorTransparentBrush: "#00FFFFFF"
  ControlFillColorInputActiveBrush: "#B31E1E1E"
  ControlStrongFillColorDefaultBrush: "#8BFFFFFF"
  ControlStrongFillColorDisabledBrush: "#3FFFFFFF"
  ControlSolidFillColorDefaultBrush: "#454545"

  # Subtle Fill Colors
  SubtleFillColorTransparentBrush: "#00FFFFFF"
  SubtleFillColorSecondaryBrush: "#0FFFFFFF"
  SubtleFillColorTertiaryBrush: "#0AFFFFFF"
  SubtleFillColorDisabledBrush: "#00FFFFFF"

  # Control Alt Fill Colors
  ControlAltFillColorTransparentBrush: "#00FFFFFF"
  ControlAltFillColorSecondaryBrush: "#19000000"
  ControlAltFillColorTertiaryBrush: "#0BFFFFFF"
  ControlAltFillColorQuarternaryBrush: "#12FFFFFF"
  ControlAltFillColorDisabledBrush: "#00FFFFFF"

  # Control On Image Fill Colors
  ControlOnImageFillColorDefaultBrush: "#B31C1C1C"
  ControlOnImageFillColorSecondaryBrush: "#1A1A1A"
  ControlOnImageFillColorTertiaryBrush: "#131313"
  ControlOnImageFillColorDisabledBrush: "#1E1E1E"

  # Accent Fill Colors
  AccentFillColorDisabledBrush: "#28FFFFFF"
  AccentFillColorSelectedTextBackgroundBrush: "#ffffff"
  AccentTextFillColorPrimaryBrush: "#99ebff"
  AccentTextFillColorSecondaryBrush: "#85c8d8"
  AccentFillColorDefaultBrush: "#4cc2ff"
  AccentFillColorSecondaryBrush: "#47b1e8"
  AccentFillColorTertiaryBrush: "#42a1d2"

  # Stroke Colors
  ControlStrokeColorDefaultBrush: "#12FFFFFF"
  ControlStrokeColorSecondaryBrush: "#18FFFFFF"
  ControlStrokeColorOnAccentDefaultBrush: "#14FFFFFF"
  ControlStrokeColorOnAccentSecondaryBrush: "#23000000"
  ControlStrokeColorOnAccentTertiaryBrush: "#37000000"
  ControlStrokeColorOnAccentDisabledBrush: "#33000000"
  ControlStrokeColorForStrongFillWhenOnImageBrush: "#6B000000"
  CardStrokeColorDefaultBrush: "#19000000"
  CardStrokeColorDefaultSolidBrush: "#1C1C1C"
  ControlStrongStrokeColorDefaultBrush: "#8BFFFFFF"
  ControlStrongStrokeColorDisabledBrush: "#28FFFFFF"
  SurfaceStrokeColorDefaultBrush: "#66757575"
  SurfaceStrokeColorFlyoutBrush: "#33000000"
  SurfaceStrokeColorInverseBrush: "#0F000000"
  DividerStrokeColorDefaultBrush: "#15FFFFFF"
  FocusStrokeColorOuterBrush: "#FFFFFF"
  FocusStrokeColorInnerBrush: "#B3000000"

  # Background / Layer Colors
  CardBackgroundFillColorDefaultBrush: "#0DFFFFFF"
  CardBackgroundFillColorSecondaryBrush: "#08FFFFFF"
  SmokeFillColorDefaultBrush: "#4D000000"
  LayerFillColorDefaultBrush: "#4C3A3A3A"
  LayerFillColorAltBrush: "#0DFFFFFF"
  LayerOnAcrylicFillColorDefaultBrush: "#09FFFFFF"
  LayerOnAccentAcrylicFillColorDefaultBrush: "#09FFFFFF"
  LayerOnMicaBaseAltFillColorDefaultBrush: "#733A3A3A"
  LayerOnMicaBaseAltFillColorSecondaryBrush: "#0FFFFFFF"
  LayerOnMicaBaseAltFillColorTertiaryBrush: "#2C2C2C"
  LayerOnMicaBaseAltFillColorTransparentBrush: "#00FFFFFF"

  # Solid Background Colors
  SolidBackgroundFillColorBaseBrush: "#202020"
  SolidBackgroundFillColorSecondaryBrush: "#1C1C1C"
  SolidBackgroundFillColorTertiaryBrush: "#282828"
  SolidBackgroundFillColorQuarternaryBrush: "#2C2C2C"
  SolidBackgroundFillColorBaseAltBrush: "#0A0A0A"

  # System Fill Colors
  SystemFillColorSuccessBrush: "#6CCB5F"
  SystemFillColorCautionBrush: "#FCE100"
  SystemFillColorCriticalBrush: "#FF99A4"
  SystemFillColorNeutralBrush: "#8BFFFFFF"
  SystemFillColorSolidNeutralBrush: "#9D9D9D"
  SystemFillColorAttentionBackgroundBrush: "#08FFFFFF"
  SystemFillColorSuccessBackgroundBrush: "#393D1B"
  SystemFillColorCautionBackgroundBrush: "#433519"
  SystemFillColorCriticalBackgroundBrush: "#442726"
  SystemFillColorNeutralBackgroundBrush: "#08FFFFFF"
  SystemFillColorSolidAttentionBackgroundBrush: "#2E2E2E"
  SystemFillColorSolidNeutralBackgroundBrush: "#2E2E2E"

  # Temporary system color placeholders (all #FF00FF in XAML)
  SystemColorWindowTextColorBrush: "#FF00FF"
  SystemColorWindowColorBrush: "#FF00FF"
  SystemColorButtonFaceColorBrush: "#FF00FF"
  SystemColorButtonTextColorBrush: "#FF00FF"
  SystemColorHighlightColorBrush: "#FF00FF"
  SystemColorHighlightTextColorBrush: "#FF00FF"
  SystemColorHotlightColorBrush: "#FF00FF"
  SystemColorGrayTextColorBrush: "#FF00FF"